apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: frontend
          image: ${ECR_REGISTRY}/hrflow/frontend:${IMAGE_TAG}
          ports:
            - containerPort: 3005
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 192Mi
          readinessProbe:
            tcpSocket:
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 10
