apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  # Rolling Update explicite (alternative retenue au Blue/Green, voir
  # docs/BLUE-GREEN-STRATEGIE.md) : maxUnavailable=0 garantit qu'il y 
  # toujours au moins autant de pods "old" que de replicas demandés tant que
  # le "new" pod n'est pas Ready ; maxSurge=1 autorise un pod supplémentaire
  # temporaire pour faire cette transition sans jamais couper le service.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: frontend
          image: ${ECR_REGISTRY}/hrflow/frontend:${IMAGE_TAG}
          ports:
            - containerPort: 3005
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 192Mi
          readinessProbe:
            tcpSocket:
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 10
