apiVersion: apps/v1
kind: Deployment
metadata:
  name: paie
spec:
  # Sur un t4g.large, avec 6 services + Prometheus/Grafana, commencez à 1 replica
  # par service. Passez à 2 une fois l'instance dimensionnée en conséquence
  # (t4g.xlarge par ex.), sinon les pods restent Pending faute de CPU/RAM.
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: paie
  template:
    metadata:
      labels:
        app: paie
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: paie
          image: ${ECR_REGISTRY}/hrflow/paie:${IMAGE_TAG}
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: hrflow-config
            - secretRef:
                name: hrflow-secrets

          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
