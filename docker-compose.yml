services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Only expose PostgreSQL to the local machine.
    # Remove this completely if you don't need psql from the host.
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${DB_USER}\" -d \"$${DB_NAME}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Remove this entirely if Redis is only used by the containers.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true

  auth:
    build:
      context: .
      dockerfile: docker/back/auth/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AUTH_HOST_PORT:-3001}:3001"
    security_opt:
      - no-new-privileges:true

  paie:
    build:
      context: .
      dockerfile: docker/back/paie/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PAIE_HOST_PORT:-3002}:3002"
    security_opt:
      - no-new-privileges:true

  conges:
    build:
      context: .
      dockerfile: docker/back/conges/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONGES_HOST_PORT:-3003}:3003"
    security_opt:
      - no-new-privileges:true

  recrutement:
    build:
      context: .
      dockerfile: docker/back/recrutement/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RECRUTEMENT_HOST_PORT:-3004}:3004"
    security_opt:
      - no-new-privileges:true

  gateway:
    build:
      context: .
      dockerfile: docker/back/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      AUTH_SERVICE_URL: http://auth:3001
      PAIE_SERVICE_URL: http://paie:3002
      CONGES_SERVICE_URL: http://conges:3003
      RECRUTEMENT_SERVICE_URL: http://recrutement:3004
    depends_on:
      auth:
        condition: service_started
      paie:
        condition: service_started
      conges:
        condition: service_started
      recrutement:
        condition: service_started
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-3006}:3000"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: docker/front/Dockerfile
      # CRA compile REACT_APP_API_URL au build, pas au runtime : il faut donc le
      # passer en build-arg (un `environment:` seul n'a aucun effet sur le bundle).
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    restart: unless-stopped
    environment:
      PORT: 3005
      HOST: 0.0.0.0
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3007}:3005"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data: